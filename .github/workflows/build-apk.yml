name: Android APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 패키지 설치
        run: npm install
      - name: Android 프로젝트 생성
        run: npx cap add android
      - name: 앱 아이콘 생성
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - name: 웹 파일 동기화
        run: npx cap sync android
      - name: 고정 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/fixed.keystore"
            cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  fixed {
                      storeFile file(System.getenv("HOME") + "/fixed.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.fixed } }
          }
          GRADLE
            echo "고정 서명 키 사용"
          else
            echo "서명 키 없음 - 임시 키로 빌드"
          fi
      - name: APK 빌드
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: 서명 확인
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: bending-marking-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bend-calc.apk
      - name: 최신 APK 릴리스에 올리기 (폰에서 바로 받기용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 벤딩 마킹 계산기 APK (최신)
          body: 최신 APK예요. 아래 bend-calc.apk 를 눌러 받으세요.
          files: bend-calc.apk
          make_latest: true
          overwrite_files: true
